# ─────────────────────────────────────────────────────────────────────────────
# CloudOps AI — Backend HorizontalPodAutoscaler  (Phase 4)
#
# Automatically scales the number of backend Deployment replicas between
# 2 (minimum — always available) and 5 (maximum) based on CPU utilisation.
#
# Requires: metrics-server
#   Minikube:  minikube addons enable metrics-server
#   Others:    kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Scale-up trigger:   avg CPU across all backend pods > 70% of the request
# Scale-down trigger: avg CPU drops and stays below threshold for 5 minutes
#                     (controlled by the --horizontal-pod-autoscaler-downscale-stabilization
#                     flag on the kube-controller-manager, default 5 min)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cloudops-ai
  labels:
    app.kubernetes.io/name: backend-hpa
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudops-ai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend

  minReplicas: 2
  maxReplicas: 5

  metrics:
    # ── CPU-based scaling ────────────────────────────────────────────────────
    # AverageUtilization is relative to the cpu.request defined in the
    # backend Deployment (250m).  When the average CPU across all pods
    # exceeds 70% of 250m (≈ 175m), a new replica is added.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # ── Memory-based scaling (optional — uncomment if needed) ───────────────
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       type: Utilization
    #       averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60     # wait 60 s before scaling up again
      policies:
        - type: Pods
          value: 1                        # add at most 1 pod at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300    # wait 5 min before scaling down
      policies:
        - type: Pods
          value: 1                        # remove at most 1 pod at a time
          periodSeconds: 60
