# ─────────────────────────────────────────────────────────────────────────────
# CloudOps AI — PostgreSQL Secret  (Phase 4)
#
# Stores all PostgreSQL credentials and the full DATABASE_URL connection
# string used by the backend.
#
# stringData values are stored in plain text here; Kubernetes automatically
# base64-encodes them before writing to etcd.  This file should NOT be
# committed to a public repository.  Use Sealed Secrets, Vault, or
# External Secrets Operator to manage secrets in production.
#
# The DATABASE_URL uses "postgres" as the hostname — this matches the
# ClusterIP Service name defined in postgres/service.yaml.  Kubernetes
# internal DNS resolves  postgres.cloudops-ai.svc.cluster.local → the
# PostgreSQL pod automatically.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cloudops-ai
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudops-ai
type: Opaque
stringData:
  # Individual credentials used by the postgres:16-alpine container
  POSTGRES_USER:     "postgres"
  POSTGRES_PASSWORD: "jasnoor2409"
  POSTGRES_DB:       "cloudops"

  # Full connection string consumed by the backend (SQLAlchemy / Alembic).
  # Uses the psycopg3 driver (postgresql+psycopg://).
  # Host "postgres" is the Kubernetes Service name — resolved by cluster DNS.
  DATABASE_URL: "postgresql+psycopg://postgres:jasnoor2409@postgres:5432/cloudops"
