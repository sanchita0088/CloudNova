# ─────────────────────────────────────────────────────────────────────────────
# CloudOps AI — Backend ConfigMap  (Phase 4)
#
# Stores all non-sensitive backend configuration.
# Sensitive values (DATABASE_URL, API keys) live in postgres-secret.
#
# CORS_ORIGINS note
# ─────────────────
# pydantic-settings v2 parses List[str] fields from environment variables
# as JSON arrays.  The value below is valid JSON and will be decoded
# correctly by app.core.config.Settings — NO code change is required.
# "http://cloudops.local" is the Ingress hostname used in K8s.
# The localhost entries preserve compatibility with direct port-forward access.
#
# OLLAMA_BASE_URL / PROMETHEUS_URL note
# ──────────────────────────────────────
# If Ollama / Prometheus run OUTSIDE the cluster (e.g. on the host machine),
# replace the values below with the appropriate external hostname or IP.
# If they run INSIDE the cluster as Kubernetes Services, use their
# cluster-internal DNS names (e.g. http://ollama.default.svc.cluster.local:11434).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: cloudops-ai
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: cloudops-ai
data:
  # ── Application ─────────────────────────────────────────────────────────────
  PROJECT_NAME:   "CloudOps AI"
  API_V1_STR:     "/api/v1"

  # ── CORS — JSON array parsed by pydantic-settings v2 ──────────────────────
  # Includes the Ingress hostname so browser requests from the frontend pass.
  CORS_ORIGINS: >-
    ["http://cloudops.local",
     "http://localhost:3000",
     "http://localhost:5173",
     "http://127.0.0.1:3000",
     "http://127.0.0.1:5173"]

  # ── Ollama (local AI) ───────────────────────────────────────────────────────
  # Update this URL to point to wherever Ollama is reachable from the cluster.
  OLLAMA_BASE_URL:         "http://host.docker.internal:11434"
  OLLAMA_MODEL:            "llama3.2"
  OLLAMA_EMBEDDING_MODEL:  "llama3.2"

  # ── Prometheus monitoring ───────────────────────────────────────────────────
  # Update this URL if Prometheus runs inside the cluster as a Service.
  PROMETHEUS_URL: "http://host.docker.internal:9090"
