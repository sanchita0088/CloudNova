server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Proxy /api to backend service ─────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # All routes that are not real files are served as index.html so that
    # React Router (react-router-dom) can handle client-side navigation
    # without getting a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Hashed static assets — cache aggressively ─────────────────────────
    # Vite outputs assets with content-hash filenames (e.g. index-DXa1bQ.js).
    # They never change for the same content, so 1-year cache is safe.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── index.html — never cache ──────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── Gzip compression ─────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;
    gzip_min_length 256;
}
